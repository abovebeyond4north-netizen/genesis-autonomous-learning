name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m genesis train --episodes 12 --seed 4 --budget 120
      - run: python -m genesis crossdomain --runs 1 --episodes 10 --tasks 10 --seed 5 --budget 100
      - run: python -m genesis discover --runs 1 --episodes 10 --tasks 10 --seed 5 --budget 100
