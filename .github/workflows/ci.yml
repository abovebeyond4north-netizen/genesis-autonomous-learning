name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m genesis train --episodes 12 --seed 4 --budget 120
      - run: python -m genesis crossdomain --runs 1 --episodes 10 --tasks 10 --seed 5 --budget 100
      - run: python -m genesis discover --runs 1 --episodes 10 --tasks 10 --seed 5 --budget 100
      - run: python -m genesis emerge --runs 2 --train-steps 2600 --test-steps 150
      - run: python -m genesis emerge --runs 30 --train-steps 2600 --test-steps 1200 --seed 0 --output evidence/emergence_ci
      - uses: actions/upload-artifact@v4
        with:
          name: emergence-${{ matrix.python-version }}
          path: evidence/emergence_ci/
          retention-days: 30
      - run: python -m genesis partial --runs 2 --episodes 6 --steps 85 --seed 3
      - run: python -m genesis partial --runs 20 --episodes 30 --steps 250 --seed 0 --output evidence/partial_ci
      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.python-version }}
          path: evidence/partial_ci/
          retention-days: 30
